# templates/base/tmux.conf
# Minimal, functional tmux configuration for TEAL student containers

# Enable mouse support for scrolling, selecting text, and pane switching
set -g mouse on

# Increase scrollback buffer to 10,000 lines
set -g history-limit 10000

# Prevent delays on Esc key (important for vim / nano)
set -s escape-time 10

# Set terminal colors
set -g default-terminal "screen-256color"

# Clean status bar styling (pure black matching ttyd)
set -g status-style bg=default,fg=colour136
set -g status-left-length 20
set -g status-left "#[fg=#2dd4bf,bold][TEAL] "
set -g status-right "#[fg=colour240]%H:%M #[fg=colour245]%d-%b"
