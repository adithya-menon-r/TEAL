# infra/cloudbuild.yaml
# Builds one image per run. Choose which image via --substitutions.
#
# Usage examples (run from repo root in Cloud Shell):
#
#   # Build the gateway first (lab images depend on it)
#   gcloud builds submit --config infra/cloudbuild.yaml \
#     --substitutions=_IMAGE=gateway,_TAG=v1,_DOCKERFILE=templates/gateway.Dockerfile .
#
#   # Build a lab image (requires gateway image to exist)
#   gcloud builds submit --config infra/cloudbuild.yaml \
#     --substitutions=_IMAGE=linux,_TAG=v1,_DOCKERFILE=templates/linux/Dockerfile,_GATEWAY_TAG=v1 .
#
#   # Build the backend API image
#   gcloud builds submit --config infra/cloudbuild.yaml \
#     --substitutions=_IMAGE=api,_TAG=v1,_DOCKERFILE=backend/Dockerfile .

substitutions:
  _IMAGE: linux
  _TAG: v1
  _DOCKERFILE: templates/linux/Dockerfile
  _GATEWAY_TAG: v1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/teal/${_IMAGE}:${_TAG}
      - -f
      - ${_DOCKERFILE}
      - --build-arg
      - GATEWAY_IMAGE=asia-south1-docker.pkg.dev/$PROJECT_ID/teal/gateway:${_GATEWAY_TAG}
      - .

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/teal/${_IMAGE}:${_TAG}

options:
  machineType: E2_HIGHCPU_8
