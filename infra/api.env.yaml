# infra/api.env.yaml
# Environment variables for the teal-api Cloud Run service.
# No secrets here — safe to commit.
# Deploy with: gcloud run deploy teal-api --env-vars-file=infra/api.env.yaml ...
#
# TODO: after first deploy, fill in PUBLIC_URL with the printed Cloud Run URL.
# TODO: fill in FRONTEND_ORIGIN once the domain is decided with Adithya.

GCP_PROJECT: "bold-future-510804-q8"
REGION: "asia-south1"
LAB_SA: "teal-lab-runtime@bold-future-510804-q8.iam.gserviceaccount.com"
SCHEDULER_SA: "teal-scheduler@bold-future-510804-q8.iam.gserviceaccount.com"
IMAGE_REPO: "asia-south1-docker.pkg.dev/bold-future-510804-q8/teal"
CATALOG_PATH: "/app/catalog.json"
ALLOWED_EMAIL_REGEX: '^[^@\s]+@[a-z0-9-]+\.students\.amrita\.edu$'
FRONTEND_ORIGIN: "https://teal-amrita.pages.dev"
PUBLIC_URL: "https://teal-api-1021285110928.asia-south1.run.app"
MAX_CONCURRENT_LABS: "40"
LAUNCHES_ENABLED: "true"
PRICE_VCPU_SEC: "0.000018"
PRICE_GIB_SEC: "0.000002"
